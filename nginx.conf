# Configuración Nginx para Inducción RR.HH. Lavín
# Copiar a /etc/nginx/sites-available/induccion-lavin y habilitar con:
#   ln -s /etc/nginx/sites-available/induccion-lavin /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;  # acepta cualquier hostname/IP en la red local

    # Subidas grandes (videos hasta 2 GB)
    client_max_body_size 2G;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Servir videos directamente desde disco (mejor performance que pasar por Node)
    # OJO: esto BYPASEA la autenticación. Si necesitas acceso autenticado, comenta este bloque.
    # location /uploads/ {
    #     alias /ruta/absoluta/a/induccion-app/uploads/;
    #     add_header Cache-Control "no-store";
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_buffering off;
    }
}
